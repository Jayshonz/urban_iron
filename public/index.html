<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Urban Iron Athlete Portal</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/checkin.css">
</head>
<body>
<header class="portal-header">
  <div class="header-inner">
    <a class="brand" href="/" aria-label="Urban Iron athlete portal home">
      <img src="/urban-iron-logo.png" alt="Urban Iron">
    </a>
    <div class="future-login" aria-disabled="true">
      <span>Member login</span>
      <small>Coming later</small>
    </div>
  </div>
</header>
<main>
  <section id="home" class="home-race-hero" aria-labelledby="homeTitle">
    <img class="home-hero-image" src="https://photos.urbaniron.co/urban-iron-home-hero.jpg" alt="Urban Iron athletes gathering beneath the event banner" fetchpriority="high">
    <span class="home-hero-shade" aria-hidden="true"></span>
    <div class="home-race-selector">
      <p class="eyebrow">ATHLETE PORTAL</p>
      <h1 id="homeTitle">Find your race</h1>
      <p>Choose your event for heat lookup, race-day information, prep guides, and partner offers.</p>
      <form id="raceForm" class="home-race-form">
        <label class="sr-only" for="raceSelect">Select race</label>
        <select id="raceSelect" disabled>
          <option value="">Loading live races…</option>
        </select>
        <button id="openRace" type="submit" disabled>Open athlete portal</button>
      </form>
      <p id="status" class="home-status" role="status">Loading live races…</p>
    </div>
  </section>

  <section id="raceFlow" class="race-shell" hidden>
    <div class="race-shell-inner">
      <button id="back" class="text-button">← Change race</button>
      <h2 id="raceTitle"></h2>

      <div id="gate">
        <p class="step-label">ENTER RACE PASSWORD</p>
        <input id="password" type="password" autocomplete="current-password" placeholder="Race password">
        <button id="unlock">Enter athlete portal</button>
        <div id="gateMessage"></div>
      </div>

      <div id="searchPanel" hidden>
        <p class="step-label">SEARCH ATHLETES</p>
        <input id="query" autocomplete="off" placeholder="First name, last name, or email">
        <button id="find">Find my heat</button>
        <div id="result"></div>
      </div>
    </div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
