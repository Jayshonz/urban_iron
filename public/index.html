<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Urban Iron Participant Portal</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <header><b>URBAN<br>IRON</b><span>PARTICIPANT PORTAL</span></header>
  <section id="app">
    <p class="eyebrow">I'M A PARTICIPANT</p>
    <h1>FIND YOUR<br>HEAT.</h1>
    <p id="status">Loading live races…</p>
    <div id="races"></div>

    <div id="raceFlow" hidden>
      <button id="back" class="text-button">← Change race</button>
      <h2 id="raceTitle"></h2>

      <div id="gate">
        <p class="step-label">ENTER RACE PASSWORD</p>
        <input id="password" type="password" autocomplete="current-password" placeholder="Race password">
        <button id="unlock">Enter participant portal</button>
        <div id="gateMessage"></div>
      </div>

      <div id="searchPanel" hidden>
        <p class="step-label">SEARCH PARTICIPANTS</p>
        <input id="query" autocomplete="off" placeholder="First name, last name, or email">
        <button id="find">Find my heat</button>
        <div id="result"></div>
      </div>
    </div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
